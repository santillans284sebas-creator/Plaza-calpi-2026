<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Plaza de Toros Calpi 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1e1e1e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        svg {
            background-color: #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .asiento {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .asiento:hover {
            stroke: #ffffff;
            stroke-width: 2px;
            opacity: 0.8;
        }
        .disponible { fill: #4CAF50; background-color: #4CAF50; } /* Verde */
        .ocupado { fill: #F44336; background-color: #F44336; }    /* Rojo */
        .reservado { fill: #FFEB3B; background-color: #FFEB3B; }  /* Amarillo */
        
        .panel-contadores {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        .tarjeta-contador {
            background-color: #2a2a2a;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .leyenda {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .item-leyenda {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .caja-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid #ffffff;
        }

        .btn-exportar {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #2196F3;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        .btn-exportar:hover {
            background-color: #1976D2;
        }

        .credito-pie {
            margin-top: 35px;
            font-style: italic;
            color: #888888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Mapa de Taquilla - Plaza de Toros Calpi 2026</h1>
    <p>Haz clic en cualquier puesto para cambiar su estado (Disponible / Ocupado / Reservado)</p>

    <!-- Resumen de Contadores -->
    <div class="panel-contadores">
        <div class="tarjeta-contador">Libres: <span id="num-disponibles" style="color: #4CAF50;">60</span></div>
        <div class="tarjeta-contador">Vendidos: <span id="num-ocupados" style="color: #F44336;">0</span></div>
        <div class="tarjeta-contador">Reservados: <span id="num-reservados" style="color: #FFEB3B;">0</span></div>
    </div>

    <div class="container">
        <svg id="plaza" width="700" height="700" viewBox="0 0 700 700">
            <!-- Ruedo Central -->
            <circle cx="350" cy="350" r="160" fill="#d2b48c" stroke="#5c4033" stroke-width="6"/>
            <text x="350" y="355" font-size="22" font-weight="bold" fill="#5c4033" text-anchor="middle">RUEDO</text>
            
            <!-- Grupo de puestos -->
            <g id="puestos-container"></g>
        </svg>

        <div class="leyenda">
            <div class="item-leyenda">
                <div class="caja-color disponible"></div> <span>Libre</span>
            </div>
            <div class="item-leyenda">
                <div class="caja-color ocupado"></div> <span>Vendido / Ocupado</span>
            </div>
            <div class="item-leyenda">
                <div class="caja-color reservado"></div> <span>Reservado</span>
            </div>
        </div>

        <button class="btn-exportar" onclick="exportarExcel()">Descargar Reporte Excel</button>

        <p class="credito-pie">by: Sebastian Santillan</p>
    </div>

    <script>
        const container = document.getElementById('puestos-container');
        const totalPuestos = 60;
        const cx = 350;
        const cy = 350;
        const radio = 220;

        let libres = totalPuestos;
        let ocupados = 0;
        let reservados = 0;

        function actualizarContadoresUI() {
            document.getElementById('num-disponibles').textContent = libres;
            document.getElementById('num-ocupados').textContent = ocupados;
            document.getElementById('num-reservados').textContent = reservados;
        }

        // Generar los 60 puestos
        for (let i = 1; i <= totalPuestos; i++) {
            const angle = ((i - 1) / totalPuestos) * 2 * Math.PI - (Math.PI / 2);
            const x = cx + radio * Math.cos(angle);
            const y = cy + radio * Math.sin(angle);

            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", x - 12);
            rect.setAttribute("y", y - 12);
            rect.setAttribute("width", 24);
            rect.setAttribute("height", 24);
            rect.setAttribute("rx", 4);
            rect.setAttribute("class", "asiento disponible");
            rect.setAttribute("data-estado", "disponible");
            rect.setAttribute("id", `puesto-${i}`);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x);
            text.setAttribute("y", y + 4);
            text.setAttribute("font-size", "10");
            text.setAttribute("fill", "#000");
            text.setAttribute("font-weight", "bold");
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("pointer-events", "none");
            text.textContent = i;

            rect.addEventListener('click', function() {
                const estadoActual = this.getAttribute('data-estado');

                if (estadoActual === 'disponible') {
                    this.setAttribute('data-estado', 'ocupado');
                    this.setAttribute('class', 'asiento ocupado');
                    libres--;
                    ocupados++;
                } else if (estadoActual === 'ocupado') {
                    this.setAttribute('data-estado', 'reservado');
                    this.setAttribute('class', 'asiento reservado');
                    ocupados--;
                    reservados++;
                } else {
                    this.setAttribute('data-estado', 'disponible');
                    this.setAttribute('class', 'asiento disponible');
                    reservados--;
                    libres++;
                }

                actualizarContadoresUI();
            });

            g.appendChild(rect);
            g.appendChild(text);
            container.appendChild(g);
        }

        // Función para exportar a Excel con formato HTML estilizado (.xls)
        function exportarExcel() {
            let tablaHTML = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="UTF-8">
                    <style>
                        body { font-family: Arial, sans-serif; }
                        th { background-color: #1a237e; color: #ffffff; font-size: 14px; text-align: center; }
                        td { text-align: center; font-size: 12px; }
                        .libre { background-color: #c8e6c9; color: #1b5e20; font-weight: bold; }
                        .vendido { background-color: #ffcdd2; color: #b71c1c; font-weight: bold; }
                        .reservado { background-color: #fff9c4; color: #f57f17; font-weight: bold; }
                        .titulo { font-size: 16px; font-weight: bold; background-color: #e0e0e0; }
                        .resumen { font-weight: bold; background-color: #f5f5f5; }
                    </style>
                </head>
                <body>
                    <table>
                        <tr>
                            <td colspan="2" class="titulo">REPORTE TAQUILLA - PLAZA DE TOROS CALPI 2026</td>
                        </tr>
                        <tr><td colspan="2"></td></tr>
                        <tr>
                            <th>Número de Puesto</th>
                            <th>Estado Actual</th>
                        </tr>
            `;

            for (let i = 1; i <= totalPuestos; i++) {
                const puesto = document.getElementById(`puesto-${i}`);
                const estado = puesto.getAttribute('data-estado');
                let estadoTexto = "Libre";
                let claseColor = "libre";

                if (estado === "ocupado") {
                    estadoTexto = "Vendido";
                    claseColor = "vendido";
                } else if (estado === "reservado") {
                    estadoTexto = "Reservado";
                    claseColor = "reservado";
                }

                tablaHTML += `
                    <tr>
                        <td>Puesto ${i}</td>
                        <td class="${claseColor}">${estadoTexto}</td>
                    </tr>
                `;
            }

            tablaHTML += `
                        <tr><td colspan="2"></td></tr>
                        <tr class="resumen"><td>Total Libres:</td><td>${libres}</td></tr>
                        <tr class="resumen"><td>Total Vendidos:</td><td>${ocupados}</td></tr>
                        <tr class="resumen"><td>Total Reservados:</td><td>${reservados}</td></tr>
                    </table>
                </body>
                </html>
            `;

            const blob = new Blob([tablaHTML], { type: 'application/vnd.ms-excel;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const enlace = document.createElement('a');
            enlace.href = url;
            enlace.setAttribute('download', 'Reporte_Plaza_Toros_Calpi_2026.xls');
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
        }
    </script>
</body>
</html>
