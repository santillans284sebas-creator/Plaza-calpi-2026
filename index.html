<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaza de Toros Calpi 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            text-align: center;
        }

        .subtitulo {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 20px;
            text-align: center;
        }

        .mapa-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .asiento {
            cursor: pointer;
            transition: fill 0.2s ease, transform 0.1s ease;
        }

        .asiento:hover {
            opacity: 0.8;
        }

        .leyenda {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .panel-control {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 450px;
        }

        .btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0b7dda;
        }

        .btn-reset {
            background-color: #444;
            color: #ccc;
            font-size: 13px;
            padding: 8px 15px;
        }

        .btn-reset:hover {
            background-color: #d32f2f;
            color: white;
        }

        .creditos {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>Mapa de Taquilla - Plaza de Toros Calpi 2026</h1>
    <div class="subtitulo">Haz clic en cualquier puesto para cambiar su estado (Disponible / Ocupado / Reservado)</div>

    <div class="mapa-container">
        <svg viewBox="0 0 500 500" id="svg-mapa">
            <!-- Ruedo Central -->
            <circle cx="250" cy="250" r="120" fill="#e0a96d" stroke="#8b5a2b" stroke-width="4"/>
            <text x="250" y="255" font-family="Arial" font-size="20" font-weight="bold" fill="#5c3a1e" text-anchor="middle">RUEDO</text>
            
            <!-- Asientos generados por JS -->
            <g id="grupo-asientos"></g>
        </svg>

        <div class="leyenda">
            <div class="leyenda-item">
                <div class="color-box" style="background-color: #4CAF50;"></div>
                <span>Libre (<span id="cnt-libre">60</span>)</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: #f44336;"></div>
                <span>Vendido (<span id="cnt-vendido">0</span>)</span>
            </div>
            <div class="leyenda-item">
                <div class="color-box" style="background-color: #ff9800;"></div>
                <span>Reservado (<span id="cnt-reservado">0</span>)</span>
            </div>
        </div>
    </div>

    <div class="panel-control">
        <button class="btn" onclick="descargarExcel()">Descargar Reporte Excel</button>
        <button class="btn btn-reset" onclick="reiniciarMapa()">Reiniciar Mapa (Borrar datos)</button>
    </div>

    <div class="creditos">by: Sebastian Santillan</div>

    <script>
        const TOTAL_ASIENTOS = 60;
        const COLORES = {
            libre: '#4CAF50',
            vendido: '#f44336',
            reservado: '#ff9800'
        };

        const estadoAsientos = {};

        // Inicializar los 60 asientos en círculo
        function generarMapa() {
            const grupo = document.getElementById('grupo-asientos');
            const cx = 250, cy = 250, radio = 170;

            for (let i = 1; i <= TOTAL_ASIENTOS; i++) {
                const angulo = ((i - 1) / TOTAL_ASIENTOS) * (2 * Math.PI) - (Math.PI / 2);
                const x = cx + radio * Math.cos(angulo);
                const y = cy + radio * Math.sin(angulo);

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', 11);
                circle.setAttribute('class', 'asiento');
                circle.setAttribute('id', `asiento-${i}`);
                circle.setAttribute('data-id', i);
                
                // Evento al tocar asiento
                circle.addEventListener('click', () => cambiarEstado(i));

                grupo.appendChild(circle);

                // Texto con número de asiento
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y + 3);
                text.setAttribute('font-size', '8');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('fill', '#ffffff');
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('pointer-events', 'none');
                text.textContent = i;

                grupo.appendChild(text);

                // Estado por defecto
                estadoAsientos[i] = 'libre';
            }

            // Cargar datos previos de localStorage
            cargarEstadoGuardado();
        }

        function cambiarEstado(id) {
            const estadoActual = estadoAsientos[id];
            let nuevoEstado = 'libre';

            if (estadoActual === 'libre') nuevoEstado = 'vendido';
            else if (estadoActual === 'vendido') nuevoEstado = 'reservado';
            else if (estadoActual === 'reservado') nuevoEstado = 'libre';

            estadoAsientos[id] = nuevoEstado;
            
            // Guardar cambios en el celular
            guardarEnLocalStorage();
            actualizarInterfaz();
        }

        function actualizarInterfaz() {
            let libres = 0, vendidos = 0, reservados = 0;

            for (let i = 1; i <= TOTAL_ASIENTOS; i++) {
                const estado = estadoAsientos[i];
                const elem = document.getElementById(`asiento-${i}`);
                if (elem) {
                    elem.setAttribute('fill', COLORES[estado]);
                }

                if (estado === 'libre') libres++;
                else if (estado === 'vendido') vendidos++;
                else if (estado === 'reservado') reservados++;
            }

            document.getElementById('cnt-libre').textContent = libres;
            document.getElementById('cnt-vendido').textContent = vendidos;
            document.getElementById('cnt-reservado').textContent = reservados;
        }

        // GUARDADO LOCAL (localStorage)
        function guardarEnLocalStorage() {
            localStorage.setItem('plazaCalpi2026_estado', JSON.stringify(estadoAsientos));
        }

        function cargarEstadoGuardado() {
            const guardado = localStorage.getItem('plazaCalpi2026_estado');
            if (guardado) {
                try {
                    const datos = JSON.parse(guardado);
                    Object.assign(estadoAsientos, datos);
                } catch(e) {
                    console.error("Error leyendo memoria local", e);
                }
            }
            actualizarInterfaz();
        }

        function reiniciarMapa() {
            if (confirm("¿Estás seguro de que quieres reiniciar todos los asientos a Libres?")) {
                for (let i = 1; i <= TOTAL_ASIENTOS; i++) {
                    estadoAsientos[i] = 'libre';
                }
                localStorage.removeItem('plazaCalpi2026_estado');
                actualizarInterfaz();
            }
        }

        // EXPORTAR A EXCEL
        function descargarExcel() {
            const data = [
                ["REPORTE DE TAQUILLA - PLAZA DE TOROS CALPI 2026"],
                ["Generado el:", new Date().toLocaleString()],
                ["by: Sebastian Santillan"],
                [],
                ["Número de Puesto", "Estado"]
            ];

            for (let i = 1; i <= TOTAL_ASIENTOS; i++) {
                const est = estadoAsientos[i];
                const estTexto = est === 'libre' ? 'Disponible' : (est === 'vendido' ? 'Vendido' : 'Reservado');
                data.push([`Puesto ${i}`, estTexto]);
            }

            data.push([]);
            data.push(["RESUMEN:"]);
            data.push(["Disponibles", document.getElementById('cnt-libre').textContent]);
            data.push(["Vendidos", document.getElementById('cnt-vendido').textContent]);
            data.push(["Reservados", document.getElementById('cnt-reservado').textContent]);

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Reporte Taquilla");

            XLSX.writeFile(wb, "Reporte_Plaza_Calpi_2026.xlsx");
        }

        // Iniciar
        document.addEventListener('DOMContentLoaded', generarMapa);
    </script>
</body>
</html>
